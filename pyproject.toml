[build-system]
# PEP 639 metadata (project.license string + license-files) requires
# setuptools >= 77 (QA Round 13, R13-4: fails on 76 with ValueError).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ifixit-mcp"
version = "0.1.0"
description = "MCP server for iFixit — repair guides, device info, repairability scores"
readme = "README.md"
requires-python = ">=3.10"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{ name = "Dthen" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["mcp>=1.0,<2.0", "httpx>=0.27,<1.0"]

[project.urls]
Repository = "https://github.com/Dthen/ifixit-mcp"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
ifixit-mcp = "ifixit_mcp.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
